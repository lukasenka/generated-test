<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kadras — filmų rekomendacijos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0C10;
    --bg-raised: #12151B;
    --line: #23272F;
    --gold: #D4A94A;
    --gold-dim: #8C7639;
    --crimson: #C1443C;
    --text: #EDEAE2;
    --text-dim: #8A8F98;
    --radius-card: 6px;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }
  h1,h2,h3, .display{
    font-family: 'Bebas Neue', 'Inter', sans-serif;
    font-weight: 400;
    letter-spacing: 0.02em;
    line-height: 1.05;
    margin: 0;
  }

  a{ color: inherit; }
  button{ font-family: inherit; }

  /* Sprocket-hole film strip — used as a structural divider, not decoration */
  .filmstrip{
    height: 14px;
    background:
      radial-gradient(circle, var(--bg) 3px, transparent 3.5px) 0 0 / 24px 14px,
      var(--line);
    border-top: 1px solid #000;
    border-bottom: 1px solid #000;
  }

  header.top{
    padding: 20px 24px 16px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    max-width: 1180px;
    margin: 0 auto;
  }
  .brand{
    font-family:'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 0.06em;
    color: var(--gold);
  }
  .brand span{ color: var(--text); }

  .hero{
    max-width: 1180px;
    margin: 0 auto;
    padding: 56px 24px 40px;
    text-align: center;
  }
  .hero h1{
    font-size: clamp(40px, 8vw, 78px);
    color: var(--text);
  }
  .hero h1 em{
    font-style: normal;
    color: var(--gold);
  }
  .hero p{
    color: var(--text-dim);
    max-width: 46ch;
    margin: 14px auto 0;
    font-size: 15px;
  }

  .search-wrap{
    max-width: 640px;
    margin: 32px auto 0;
    padding: 0 24px;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 8px 6px 20px;
  }
  .search-box svg{ flex-shrink:0; color: var(--text-dim); }
  .search-box input{
    flex:1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    padding: 10px 0;
  }
  .search-box input::placeholder{ color: var(--text-dim); }
  .search-box button{
    background: var(--gold);
    color: #14110A;
    border: none;
    border-radius: 999px;
    padding: 10px 20px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s ease;
  }
  .search-box button:hover{ background: #e5bd5f; }

  .filters{
    max-width: 1180px;
    margin: 22px auto 0;
    padding: 0 24px;
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .chip{
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--text-dim);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .chip:hover{ color: var(--text); border-color: var(--gold-dim); }
  .chip.active{
    background: var(--gold);
    color: #14110A;
    border-color: var(--gold);
    font-weight: 600;
  }

  main{
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .result-meta{
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 18px;
    min-height: 18px;
  }
  .result-meta strong{ color: var(--text); }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
  }

  .card{
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    overflow: hidden;
    display:flex;
    flex-direction: column;
    transition: transform .18s ease, border-color .18s ease;
  }
  .card:hover{ transform: translateY(-4px); border-color: var(--gold-dim); }
  .card:focus-within{ outline: 2px solid var(--gold); outline-offset: 2px; }

  .poster{
    aspect-ratio: 2/3;
    position: relative;
    display:flex;
    align-items:flex-end;
    padding: 14px;
    color: #fff;
  }
  .poster::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.75) 100%);
  }
  .poster .rating{
    position: relative;
    z-index:1;
    font-size: 13px;
    font-weight: 700;
    display:flex;
    align-items:center;
    gap:4px;
    background: rgba(10,12,16,.7);
    padding: 4px 10px;
    border-radius: 999px;
    align-self: flex-start;
    position:absolute;
    top: 12px; left: 12px;
  }
  .poster .rating svg{ width:12px; height:12px; fill: var(--gold); }

  .card-body{
    padding: 14px 14px 16px;
    display:flex;
    flex-direction: column;
    gap: 6px;
    flex:1;
  }
  .card-body h3{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: normal;
  }
  .card-meta{
    display:flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-dim);
  }
  .genre-tag{
    color: var(--gold);
    font-weight: 600;
  }

  .empty{
    text-align:center;
    padding: 70px 20px;
    color: var(--text-dim);
  }
  .empty .display{ font-size: 34px; color: var(--text); margin-bottom: 8px; }

  footer{
    border-top: 1px solid var(--line);
    padding: 24px;
    text-align:center;
    color: var(--text-dim);
    font-size: 12px;
  }

  @media (max-width: 480px){
    .grid{ grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
    .hero{ padding: 40px 20px 28px; }
    header.top{ padding: 16px 20px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
    html{ scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">KAD<span>RAS</span></div>
</header>

<div class="filmstrip"></div>

<section class="hero">
  <h1>Rask savo kitą <em>filmą</em></h1>
  <p>Ieškok pagal pavadinimą arba naršyk pagal žanrą — kolekcija atnaujinama kiekvieną savaitę.</p>

  <div class="search-wrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="Ieškoti pagal filmo pavadinimą..." autocomplete="off">
      <button id="searchBtn">Ieškoti</button>
    </div>
  </div>

  <div class="filters" id="filters"></div>
</section>

<div class="filmstrip"></div>

<main>
  <div class="result-meta" id="resultMeta"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="display">Nieko neradome</div>
    <p>Pabandyk kitą pavadinimą arba pasirink kitą žanrą.</p>
  </div>
</main>

<footer>Kadras — prototipas, sukurtas demonstracijai.</footer>

<script>
const movies = [
  { title: "Bokšto šešėlis",     genre: "Trileris",    rating: 8.4, year: 2021, color: "#3B2A1A" },
  { title: "Paskutinė stotelė",  genre: "Drama",       rating: 7.9, year: 2019, color: "#1F2A38" },
  { title: "Raudonas mėnulis",   genre: "Fantastika",  rating: 8.8, year: 2023, color: "#4A1E1E" },
  { title: "Nakties skambesys",  genre: "Siaubo",      rating: 7.2, year: 2020, color: "#101418" },
  { title: "Vasaros audra",      genre: "Romantinė",   rating: 6.9, year: 2018, color: "#3A2942" },
  { title: "Tylos zona",         genre: "Trileris",    rating: 8.1, year: 2022, color: "#22303A" },
  { title: "Aukso miestas",      genre: "Nuotykių",    rating: 7.6, year: 2017, color: "#4A3A16" },
  { title: "Pilkoji linija",     genre: "Drama",       rating: 8.0, year: 2024, color: "#2A2A2A" },
  { title: "Erdvėlaivio žurnalas", genre: "Fantastika", rating: 8.5, year: 2020, color: "#182338" },
  { title: "Juokas tamsoje",     genre: "Komedija",    rating: 6.7, year: 2016, color: "#402E14" },
  { title: "Kraujo giminė",      genre: "Siaubo",      rating: 7.4, year: 2023, color: "#33121A" },
  { title: "Šeimos receptas",    genre: "Komedija",    rating: 7.0, year: 2015, color: "#2E3A1F" },
];

const genres = ["Visi", ...Array.from(new Set(movies.map(m => m.genre)))];
let activeGenre = "Visi";
let query = "";

const filtersEl = document.getElementById('filters');
const gridEl = document.getElementById('grid');
const emptyEl = document.getElementById('emptyState');
const metaEl = document.getElementById('resultMeta');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');

function starIcon(){
  return '<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.2l7.1-.6z"/></svg>';
}

function renderFilters(){
  filtersEl.innerHTML = genres.map(g =>
    `<button class="chip ${g === activeGenre ? 'active' : ''}" data-genre="${g}">${g}</button>`
  ).join('');
  filtersEl.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeGenre = chip.dataset.genre;
      renderFilters();
      renderGrid();
    });
  });
}

function renderGrid(){
  const q = query.trim().toLowerCase();
  const filtered = movies.filter(m => {
    const matchesGenre = activeGenre === "Visi" || m.genre === activeGenre;
    const matchesQuery = m.title.toLowerCase().includes(q);
    return matchesGenre && matchesQuery;
  });

  metaEl.innerHTML = `Rasta <strong>${filtered.length}</strong> ${filtered.length === 1 ? 'filmas' : 'filmai'}`;

  if(filtered.length === 0){
    gridEl.style.display = 'none';
    emptyEl.style.display = 'block';
    return;
  }
  gridEl.style.display = 'grid';
  emptyEl.style.display = 'none';

  gridEl.innerHTML = filtered.map(m => `
    <article class="card" tabindex="0">
      <div class="poster" style="background: linear-gradient(160deg, ${m.color}, #05060a);">
        <div class="rating">${starIcon()} ${m.rating.toFixed(1)}</div>
      </div>
      <div class="card-body">
        <h3>${m.title}</h3>
        <div class="card-meta">
          <span class="genre-tag">${m.genre}</span>
          <span>${m.year}</span>
        </div>
      </div>
    </article>
  `).join('');
}

searchInput.addEventListener('input', (e) => {
  query = e.target.value;
  renderGrid();
});
searchBtn.addEventListener('click', () => renderGrid());
searchInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') renderGrid();
});

renderFilters();
renderGrid();
</script>

</body>
</html>
